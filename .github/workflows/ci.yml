name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs, but never on master: the nix job's last steps
# populate the xilo cache, and cancelling that mid-build leaves the dependency
# layer unpushed — which costs the next run a ~25 min recompile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts have no cross-run value here and inflate the cached
  # target dir, which shares a hard 10 GB per-repo cache budget.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify generated schema is up to date
        run: |
          cargo run -q -- gen-schema -o config.schema.json
          if ! git diff --quiet config.schema.json; then
            echo "config.schema.json is stale. Run 'just sync-schema' and commit."
            git diff --stat config.schema.json
            exit 1
          fi

  nix:
    name: Nix build & flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix.stubbe.dev/c/default/default
            extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
      # Build the binary and the dependency layer. --accept-flake-config
      # honors the flake's own substituter (the extra_nix_config above sets the
      # same one; this silences the untrusted-config warning).
      - name: Build package + deps layer
        run: |
          nix build -L --accept-flake-config --print-out-paths \
            '.#default' '.#deps' | tee /tmp/outpaths
      - run: nix flake check --accept-flake-config

      - name: setup xilo
        if: github.ref == 'refs/heads/master'
        uses: stubbedev/xilo@v1
        with:
          url: https://nix.stubbe.dev
          cache: default/default
          token: ${{ secrets.XILO_TOKEN }}

      # Push both paths. The deps layer is a build-time input, absent from the
      # binary's runtime closure, so pushing the binary alone never carried it —
      # which is why every run recompiled duckdb's bundled C++ engine (~15 min)
      # from scratch. A failed push is not swallowed: it would leave every
      # consumer rebuilding from source while the job still reported green.
      - name: Push to xilo cache
        if: github.ref == 'refs/heads/master'
        run: |
          set -u
          xilo push default/default $(cat /tmp/outpaths)
