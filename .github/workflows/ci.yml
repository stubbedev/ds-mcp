name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs, but never on master: the nix job's last steps
# populate the xilo cache, and cancelling that mid-build leaves the dependency
# layer unpushed — which costs the next run a ~25 min recompile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts have no cross-run value here and inflate the cached
  # target dir, which shares a hard 10 GB per-repo cache budget.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify generated schema is up to date
        run: |
          cargo run -q -- gen-schema -o config.schema.json
          if ! git diff --quiet config.schema.json; then
            echo "config.schema.json is stale. Run 'just sync-schema' and commit."
            git diff --stat config.schema.json
            exit 1
          fi

  nix:
    name: Nix build & flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}
      # Build the binary and the dependency layer. --accept-flake-config
      # honors the flake's own substituter (the xilo step above sets the same
      # one; this silences the untrusted-config warning).
      - name: Build package + deps layer
        run: |
          nix build -L --accept-flake-config \
            '.#default' '.#deps'
      - run: nix flake check --accept-flake-config

